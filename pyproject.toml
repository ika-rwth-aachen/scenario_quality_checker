[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scenario-quality-checker"
version = "0.2.0"
description = "Analyze ASAM OpenSCENARIO .xosc files for structural, schema, and motion issues"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Christoph Glasmacher", email = "christoph.glasmacher@ika.rwth-aachen.de"},
    {name = "ika - RWTH Aachen University", email = "opensource@ika.rwth-aachen.de"}
]
requires-python = ">=3.9"
dependencies = [
    "fpdf2>=2.8.1",
    "loguru>=0.7.3",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "pandas>=2.2.3",
    "scenariogeneration~=0.16.5",
    "scipy>=1.13.1",
    "shapely>=2.0.7",
    "typer>=0.15.2",
    "xmlschema>=3.4.4",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
scenario-quality-checker = "quality_checker.__main__:app"
scenario-quality-checker-web = "quality_checker.webapp.server:main"

[project.urls]
Repository = "https://github.com/ika-rwth-aachen/scenario-quality-checker"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["assets", "example_files", "tests*"]

[tool.setuptools.package-data]
quality_checker = ["schemas/*.xsd", "webapp/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
