name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Most advisories land against code that has not changed, so a pull-request
    # trigger alone would never see them.
    - cron: "17 5 * * 1"

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install ".[web,dev]"
      - name: Run tests
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install from the lockfile
        run: uv sync --frozen --extra web
      - name: Audit dependencies
        # --path audits exactly what is installed. The requirements-file mode
        # builds a throwaway virtualenv, which is not always available.
        run: uv tool run pip-audit --path .venv/lib/python*/site-packages

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No ignored files may be tracked
        # Committed build artefacts - .pyc files in particular - are
        # unreviewable and cannot be diffed. This is what keeps them out.
        run: |
          tracked_but_ignored=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$tracked_but_ignored" ]; then
            echo "These tracked files match .gitignore and must be removed:"
            echo "$tracked_but_ignored"
            exit 1
          fi
